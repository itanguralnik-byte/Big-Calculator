<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Calculator (Web)</title>
    
    <!-- Load modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Basic Reset & Body --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f9fafb; /* Light gray page background */
            color: #1f2937; /* Default text color */
            line-height: 1.6;
            padding: 2rem; /* Spacing from screen edge */
        }

        /* --- Main Content Card --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff; /* White card background */
            border-radius: 0.75rem; /* Rounded corners */
            padding: 2rem 2.5rem; /* Inner spacing */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* --- Typography --- */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }

        .hint {
            color: #6b7280;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .hint code {
            background-color: #f3f4f6;
            color: #374151;
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.85em;
        }

        /* --- Form Elements --- */
        form {
            margin-top: 1.5rem;
        }
        
        /* --- Custom Radio Buttons --- */
        .mode-toggle {
            display: flex;
            gap: 0.75rem; /* Space between buttons */
            margin-bottom: 1.5rem;
        }
        
        .mode-toggle label {
            /* Hide the original radio button */
            position: relative;
        }
        
        .mode-toggle input[type="radio"] {
            /* Visually hide the radio button */
            opacity: 0;
            position: absolute;
            width: 0;
            height: 0;
        }
        
        .radio-label-content {
            /* This is the visible "button" */
            display: block;
            padding: 0.5rem 1.25rem;
            border: 1px solid #d1d5db; /* Gray border */
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            color: #374151;
            background-color: #ffffff;
            transition: all 0.2s ease-in-out;
        }
        
        /* Style for the selected button */
        .mode-toggle input[type="radio"]:checked + .radio-label-content {
            background-color: #ebf4ff; /* Light blue background */
            border-color: #3b82f6; /* Blue border */
            color: #2563eb; /* Blue text */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); /* Blue glow */
        }
        
        /* Hover state for non-selected buttons */
        .mode-toggle input[type="radio"]:not(:checked):hover + .radio-label-content {
            background-color: #f9fafb; /* Very light gray */
        }

        /* --- Text Area --- */
        textarea {
            width: 100%;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 1rem;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db; /* Gray border */
            border-radius: 0.5rem; /* Rounded */
            margin-bottom: 1rem;
            resize: vertical; /* Allow vertical resize only */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6; /* Blue border on focus */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* Blue glow */
        }

        /* --- Submit Button --- */
        button[type="submit"] {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #3b82f6; /* Primary blue */
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #2563eb; /* Darker blue on hover */
        }

        /* --- Output Area --- */
        pre {
            background-color: #f3f4f6; /* Light gray */
            border: 1px solid #e5e7eb; /* Subtle border */
            padding: 1rem;
            border-radius: 0.5rem;
            white-space: pre-wrap; /* Keep this */
            word-wrap: break-word; /* Keep this */
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            color: #111827;
        }
        
        /* --- Responsive Adjustments --- */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            h2 {
                font-size: 1.25rem;
            }
            /* Stack radio buttons on mobile */
            .mode-toggle {
                flex-direction: column;
                align-items: stretch;
            }
            .radio-label-content {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Big Calculator (Web)</h1>
        <p class="hint">
          Select your output mode (Fraction or Float) below.
          Each expression you enter in the box (one per line) will be calculated using that mode.<br>
          Example (one line):<br>
          <code>a=5; b=3; a+b</code>
        </p>

        <form method="POST">
            <div class="mode-toggle">
                <label>
                    <input type="radio" name="output_mode" value="fraction" {% if request.form.output_mode != 'float' %}checked{% endif %}>
                    <span class="radio-label-content">Fraction</span>
                </label>
                <label>
                    <input type="radio" name="output_mode" value="float" {% if request.form.output_mode == 'float' %}checked{% endif %}>
                    <span class="radio-label-content">Float</span>
                </label>
            </div>
            
            <textarea name="inputs" rows="8" placeholder="Enter one expression per line, in order...">{{ request.form.inputs }}</textarea><br>
            <button type="submit">Run Calculator</button>
        </form>

        {% if output %}
            <h2>Output</h2>
            <pre>{{ output }}</pre>
        {% endif %}
    </div>
</body>
</html>
